# MSFS 2024 compatibility modifications: 2026-10-22; see PUBLICATION-PROVENANCE.md.
[package]
name = "xodus-service"
version = "0.1.0"
edition = "2024"
rust-version = { workspace = true }

[dependencies]
libc = "0.2"
xodus = { path = "../xodus" }
tokio = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
console-subscriber = { workspace = true, optional = true }
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
tokio-util = "0.7.19"
serde_json = "1.0.151"
# Same versions as xal 0.1 for Xbox Live request signatures (see title.rs).
p256 = "0.13"
base64ct = { version = "1.6", features = ["alloc"] }

[features]
tokio_console = ["dep:console-subscriber"]
